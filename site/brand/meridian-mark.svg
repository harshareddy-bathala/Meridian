<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>Meridian</title>
  <!-- The source vector, for design tools. Unlike /favicon.svg this carries no
       prefers-color-scheme rule and no currentColor: the two stroke colours are
       literal, so the file renders the same wherever it is opened.

       To recolour, change both stroke attributes. Light ink is #E8E6E1.

       The globe's limb and one meridian in orthographic projection: an ellipse
       whose vertical radius is the sphere's and whose horizontal radius is its
       foreshortening. Two strokes, no fill, no accent — it has to survive 16px. -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#14161B" stroke-width="4"/>
  <path d="M 32 10 A 10.5 22 0 0 0 32 54" fill="none" stroke="#14161B"
        stroke-width="3.5" stroke-linecap="round"/>
</svg>
