name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned to 3.11 deliberately: Raspberry Pi OS bookworm ships 3.11 and the
  # platform runs on the Pi. Testing on 3.12 and deploying on 3.11 is a
  # week-15 surprise.
  PYTHON_VERSION: "3.11"
  # Pinned for the same reason every image tag in deploy/ is pinned: the
  # database CI tests against and the database on the Pi should be one build.
  TIMESCALE_IMAGE: "timescale/timescaledb:2.29.0-pg16"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: Lockfile matches pyproject
        # `uv sync --frozen` in deploy/Dockerfile fails the build if the lock has
        # drifted. Catching it here turns a broken image build into a lint error
        # with an obvious fix.
        run: uv lock --check

      - name: No module over 400 lines
        # CLAUDE.local.md section 2 caps a module at 400 lines, and ruff has no
        # rule for it — so without this the one size limit that most reliably
        # predicts an unreviewable file was the one nothing checked.
        #
        # Scoped to the four distributions, which is the scope section 9's own
        # version of this check names. Tests are excluded because a table-driven
        # test file grows honestly with the number of cases it covers, and
        # site/tools are build scripts (D-044).
        #
        # Written as a loop rather than section 9's
        # `find … | tee /dev/stderr | grep -q . && exit 1 || exit 0`, whose exit
        # code is inverted by the trailing `|| exit 0` when nothing matches — it
        # reports success either way. Verified to fail by appending 300 lines to
        # config.py, which is how we know it can.
        run: |
          set -euo pipefail
          over=$(git ls-files 'platform/*.py' 'client/*.py' 'simulator/*.py' 'ingest/*.py' \
            | while read -r f; do
                n=$(wc -l < "$f")
                if [ "$n" -gt 400 ]; then echo "$f: $n lines"; fi
              done)
          if [ -n "$over" ]; then
            echo "$over" | while read -r line; do echo "::error::$line"; done
            echo "CLAUDE.local.md section 2: 400 lines is the limit. Extract a named helper, do not compress."
            exit 1
          fi

      - name: meridian.api stays behind the API layer
        # D-082: a station may declare that its coordinates be published less
        # precisely than they are stored, and that rounding happens when a public
        # response is serialised — nowhere else. The store, the scheduler and
        # pass generation read the same rows and must keep seeing full precision,
        # so the package holding the rounding has to be unreachable from them.
        #
        # A shell check rather than ruff's `banned-api`: that setting is one rule
        # covering every banned name, and `per-file-ignores` can only disable the
        # whole rule per path. Exempting the test modules that legitimately import
        # `meridian.api` would therefore also stop the `skyfield` ban applying to
        # tests, trading an enforced boundary away to add one.
        #
        # Scoped to the four distributions. `platform/src/meridian/api/**` is
        # excluded because its own modules import each other; tests are out of
        # scope by the same argument the 400-line check uses.
        run: |
          set -euo pipefail
          crossings=$(git ls-files 'platform/*.py' 'client/*.py' 'simulator/*.py' 'ingest/*.py' \
            | grep -v '^platform/src/meridian/api/' \
            | xargs grep -n -E '^\s*(from|import)\s+meridian\.api' || true)
          if [ -n "$crossings" ]; then
            echo "$crossings" | while read -r line; do echo "::error::$line"; done
            echo "docs/DECISIONS.md D-082: only meridian.api may import meridian.api."
            echo "Coordinate rounding is a serialisation rule; the store and scheduler must not reach it."
            exit 1
          fi

  site:
    # The static site had no CI at all, and site/README.md documented rules that
    # nothing enforced. Both scripts are stdlib-only and need no dependencies —
    # setup-python, not setup-uv, because neither imports anything the project
    # installs and a lockfile sync here would only be waiting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Asset stamps are current
        # /style.css and /main.js are referenced with a ?v=<content hash>, so a
        # cache can never pair one build's HTML with another's CSS. That is not
        # a hypothetical: a phone rendered current HTML against four-hour-old
        # CSS and every link on the page fell back to the user-agent blue.
        # A stale stamp here means the guarantee is not in effect.
        run: python site/tools/stamp_assets.py --check

      - name: Site invariants hold
        # Fragment links resolve, orbit.js is preloaded only where it is
        # imported statically, the sitemap matches the pages that exist, every
        # anchor sits in a context the stylesheet actually colours, and nothing
        # relies on inline CSS or JS that the CSP forbids.
        run: python site/tools/verify_site.py

  dashboard:
    # D-081's front end. The image job builds it too, but only as far as Vite
    # will compile it — type errors and the size limits eslint restates from
    # pyproject.toml would pass straight through a build, so they are checked
    # here, where the failure names the rule rather than a layer.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same release deploy/Dockerfile builds with.
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: vite build
        run: npm run build

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run mypy platform/src client/src simulator/src ingest/src

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.29.0-pg16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests run against real TimescaleDB, never SQLite. The schema uses
      # timestamptz, arrays, CHECK constraints, generated columns and
      # hypertables; a suite that passes on SQLite says nothing about what runs
      # on the Pi.
      #
      # ONE value, serving both Alembic and psycopg. meridian.config adds and
      # strips the +psycopg driver suffix as each needs it — see D-033. Before
      # that this job could not both migrate and query, which is why it ran the
      # integration tests against an empty database.
      DATABASE_URL: postgresql://meridian:meridian@localhost:5432/meridian_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev

      - name: Apply migrations
        run: uv run alembic -c deploy/alembic.ini upgrade head

      - name: Migrations are idempotent
        # Compose runs the migrate service on every `up`, so this path executes
        # on the second, third and hundredth start. If it were not a no-op the
        # ten-minute bring-up would hold exactly once per machine.
        run: uv run alembic -c deploy/alembic.ini upgrade head

      # Split from the integration run so a schema failure and a logic failure
      # are distinguishable in the run summary rather than one red X.
      - name: Unit tests
        run: uv run pytest -m "not integration and not e2e and not msp_conformance"

      - name: Integration tests
        run: uv run pytest -m integration

      # This marker was never run anywhere in CI — the exclusion in "Unit
      # tests" above dropped it and nothing picked it up, so every test in
      # tests/msp_conformance/ (the /time wire-shape suite, the client/
      # platform agreement tests) has been dead weight since the marker was
      # introduced. Same job as Integration tests, not a new one, since it
      # needs the same migrated database.
      - name: MSP conformance tests
        run: uv run pytest -m msp_conformance

      # tests/e2e/ is wired and empty until Stage 10, so this selects nothing and
      # pytest exits 5 ("no tests collected"). The step is here now rather than
      # with the first e2e test, because the alternative is a suite that lands
      # and silently never runs — which is exactly what happened to
      # msp_conformance above until it was noticed. 5 is tolerated; every other
      # non-zero code is a failure.
      #
      # This job has a database but not the compose stack, so it will need to
      # move to the `image` job when there is something to run. Left here so the
      # marker is exercised from the same place as the other three, and the move
      # is a deliberate edit rather than a discovery.
      - name: End-to-end tests
        run: |
          set -euo pipefail
          uv run pytest -m e2e || test $? -eq 5

  monitoring:
    # The alert rules, Prometheus's configuration and both Alertmanager files,
    # checked by the same tools that load them in production (D-112). A job of
    # its own because none of it needs the platform image, so a broken rule is
    # reported in seconds rather than after a cold build.
    #
    # The tool images are read from the compose file rather than written here a
    # second time: a rule tested by one Prometheus release and loaded by another
    # is a test of something that does not run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Find the images compose runs
        run: |
          set -euo pipefail
          cp deploy/.env.example deploy/.env
          images=$(docker compose -f deploy/docker-compose.yml --profile metrics config --images)
          echo "PROMETHEUS_IMAGE=$(echo "$images" | grep '^prom/prometheus:')" >> "$GITHUB_ENV"
          echo "ALERTMANAGER_IMAGE=$(echo "$images" | grep '^prom/alertmanager:')" >> "$GITHUB_ENV"

      - name: Every alert fires and stays silent as its tests say
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool \
            "$PROMETHEUS_IMAGE" test rules /p/tests/meridian.test.yml

      - name: Prometheus loads its configuration and rules
        # Mounted at the paths compose uses, so `rule_files`' absolute glob and
        # the credentials file resolve exactly as they do in the container.
        run: |
          set -euo pipefail
          cp deploy/prometheus/metrics_token.example deploy/prometheus/metrics_token
          docker run --rm \
            -v "$PWD/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/prometheus/rules:/etc/prometheus/rules:ro" \
            -v "$PWD/deploy/prometheus/metrics_token:/etc/prometheus/metrics_token:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yml

      - name: Alertmanager loads the default and the example
        run: |
          docker run --rm -v "$PWD/deploy/alertmanager:/a:ro" --entrypoint amtool \
            "$ALERTMANAGER_IMAGE" check-config /a/alertmanager.yml /a/alertmanager.example.yml

  image:
    # Build the runtime image and prove the deployment artefact works.
    #
    # This drives `docker compose` rather than a hand-rolled `docker run` against
    # a service container. The compose file is what runs on the Pi, so testing it
    # directly is what makes "docker compose up brings the platform up on a clean
    # machine" an assertion instead of a claim — and it exercises the db →
    # migrate → api dependency chain, which a bare `docker run` skips entirely.
    #
    # Build and smoke test only, no registry push: no credentials means this
    # works unchanged on a fork PR. The multi-arch build and the GHCR push the Pi
    # pulls from are image-publish.yml, which runs only once this workflow has
    # succeeded on main (D-113).
    runs-on: ubuntu-latest
    # A cold bring-up is asserted under ten minutes below, so thirty is generous.
    # Without a cap a hung step runs to GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        # Catches a typo in docker-compose.yml here rather than on the Pi at the
        # moment someone is trying to bring the platform up.
        run: |
          set -euo pipefail
          # Beside the compose file, where compose reads it (D-114). Copied to
          # the repository root, as this step once did, it was never read and
          # every value came from the compose file's defaults.
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml --profile metrics \
            --profile public --profile sim config --quiet

      - name: Bring the stack up
        run: |
          set -euo pipefail
          cp deploy/.env.example deploy/.env
          cp deploy/prometheus/metrics_token.example deploy/prometheus/metrics_token
          # Stamped before the build starts and read once every service is
          # healthy, so the figure covers what Stage 12's gate covers: image
          # build and pulls, database initialisation, migrations, and the API,
          # the jobs process and the monitoring stack all becoming ready.
          echo "BRING_UP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          # The complete stack is the default profile plus metrics. The tunnel
          # needs a real token and the simulator is exercised further down.
          docker compose -f deploy/docker-compose.yml --profile metrics up -d --build

      - name: Migrations ran and the API is healthy
        run: |
          set -euo pipefail
          # `migrate` is a one-shot service; the api service will not start until
          # it has exited successfully, so a non-zero code here means the schema
          # never landed.
          test "$(docker compose -f deploy/docker-compose.yml ps -a \
            --format '{{.Service}} {{.ExitCode}}' | grep '^migrate' | cut -d' ' -f2)" = "0"

          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8000/healthz > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"database":"ok"' /tmp/health.json

      - name: The image serves the dashboard beside the API
        # The platform starts without a dashboard when DASHBOARD_DIR holds no
        # build (D-091), so a broken COPY in the Dockerfile would still pass the
        # health check above. The asset is fetched too: an index.html whose
        # hashed script 404s is a blank page that answered 200.
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/ > /tmp/index.html
          grep -q '<div id="root"></div>' /tmp/index.html
          script=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' /tmp/index.html)
          curl -fsS -o /dev/null "http://localhost:8000${script}"

      - name: Every service with a healthcheck reports healthy
        # db, api, jobs, prometheus, alertmanager and grafana. A service that is
        # running but unhealthy is exactly what an operator would otherwise
        # discover from a blank Grafana panel.
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/docker-compose.yml --profile metrics"
          for _ in $(seq 1 60); do
            waiting=$($compose ps --format '{{.Service}} {{.Health}}' | grep -vE ' healthy$' || true)
            if [ -z "$waiting" ]; then break; fi
            sleep 3
          done
          $compose ps --format '{{.Service}} {{.Status}}'
          test -z "$waiting"

      - name: The bring-up took under ten minutes
        # "docker compose up brings the whole platform up on a clean machine in
        # under ten minutes" is asserted in six files in this repository and was
        # measured in none of them. This job is that exact scenario — a clean
        # runner, a cold build, no cached layers — so the claim is checked where
        # it is already being performed rather than trusted.
        #
        # A separate step from the health check on purpose: a failure here reads
        # as "the platform came up, too slowly", which is a different problem
        # from "the platform did not come up" and wants a different fix.
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - BRING_UP_STARTED_AT ))
          echo "cold bring-up: ${elapsed}s"
          if [ "$elapsed" -ge 600 ]; then
            echo "::error::Cold bring-up took ${elapsed}s. README.md and CLAUDE.md both call ten minutes a hard requirement."
            exit 1
          fi

      - name: Declared executables resolve inside the image
        # `meridian --version` is the one CLI subcommand that does real work, so
        # it proves the distribution installed and imports cleanly in the image —
        # which is exactly what the missing meridian.cli module broke.
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml run --rm --no-deps --entrypoint "" \
            api meridian --version
          docker compose -f deploy/docker-compose.yml run --rm --no-deps --entrypoint "" \
            api python -c "import meridian, meridian.cli, meridian_sim.station"

      - name: /metrics publishes the platform's own series, and only with the token
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer change-me" http://localhost:8000/metrics > /tmp/metrics.txt
          grep -q '^meridian_database_reachable 1.0$' /tmp/metrics.txt
          grep -q '^meridian_schema_up_to_date 1.0$' /tmp/metrics.txt
          grep -q '^meridian_stations{' /tmp/metrics.txt
          grep -q '^meridian_http_requests_total{' /tmp/metrics.txt
          # D-086: the API never computes passes, so it must not publish a count.
          if grep -q '^meridian_passes_computed' /tmp/metrics.txt; then
            echo "::error::the API published meridian_passes_computed, which only the jobs process measures"
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/metrics)" = "404"

      - name: Prometheus scrapes both targets, loads every rule and records scheduling
        # The jobs process runs its first round at start, so the schedule task's
        # last-success timestamp exists within one scrape of it finishing.
        run: |
          set -euo pipefail
          prom() {
            docker compose -f deploy/docker-compose.yml --profile metrics exec -T prometheus \
              wget -qO- "http://127.0.0.1:9090/api/v1/$1"
          }
          for _ in $(seq 1 40); do
            up=$(prom 'query?query=count(up==1)' | python3 -c \
              'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)')
            scheduled=$(prom 'query?query=count(meridian_job_last_success_timestamp_seconds%7Btask%3D%22schedule%22%7D)' \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]["result"]))')
            if [ "$up" = "2" ] && [ "$scheduled" = "1" ]; then break; fi
            sleep 3
          done
          echo "targets up: $up; schedule task recorded: $scheduled"
          test "$up" = "2"
          test "$scheduled" = "1"
          prom rules | python3 -c '
          import json, sys
          rules = [r for g in json.load(sys.stdin)["data"]["groups"] for r in g["rules"]]
          broken = [r["name"] for r in rules if r["health"] != "ok"]
          print(f"{len(rules)} rules loaded, unhealthy: {broken}")
          sys.exit(1 if broken or not rules else 0)
          '
          prom alertmanagers | grep -q 'alertmanager:9093'

      - name: Grafana provisioned the platform dashboard
        run: |
          set -euo pipefail
          curl -fsS -u admin:change-me http://localhost:3001/api/dashboards/uid/meridian-platform \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["meta"]["provisioned"]; print(len(d["dashboard"]["panels"]), "panels")'

      - name: The sim profile registers a station and stays up
        # Written when the simulator was a shell that exited 2, so it waited for
        # the container to exit. Since Stage 10 the fleet runs until stopped, and
        # that wait never ended: every run since #10 sat here until GitHub killed
        # the job at six hours. Success is now a simulated station in the
        # registry and a simulator that is still running and never restarted.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/docker-compose.yml --profile sim"
          $compose up -d simulator
          registered=0
          for _ in $(seq 1 60); do
            registered=$($compose exec -T db sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from stations where simulated"' \
              || echo 0)
            if [ "$registered" -ge 1 ]; then break; fi
            sleep 2
          done
          echo "simulated stations registered: $registered"
          test "$registered" -ge 1
          test "$(docker inspect meridian-simulator-1 \
            --format '{{.State.Running}} {{.RestartCount}}')" = "true 0"

      - name: The simulated station is counted online, labelled simulated
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer change-me" http://localhost:8000/metrics \
              | grep -q '^meridian_stations{liveness="online",simulated="true"} 1.0$'; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::no simulated station counted online in /metrics"
          exit 1

      - name: A backup restores to the same rows
        # D-115's round trip, with the tools an operator runs. The simulator and
        # the jobs process are stopped first: anything writing between the count
        # and the backup would make the comparison measure them, not the restore.
        # A row written after the backup proves the restore replaced the database
        # rather than leaving it alone.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/docker-compose.yml --profile sim --profile metrics"
          counts() {
            $compose exec -T db sh -c 'psql -X -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          select 'stations', count(*) from stations
          union all select 'passes', count(*) from passes
          union all select 'assignments', count(*) from assignments
          union all select 'heartbeats', count(*) from heartbeats
          union all select 'element_sets', count(*) from element_sets
          union all select 'invite_tokens', count(*) from invite_tokens;
          SQL
          }
          # One round now that the simulated station exists. The jobs process's
          # first round ran before it registered, which would leave passes and
          # assignments empty and the round trip proving nothing about them.
          $compose exec -T jobs meridian jobs run --once
          $compose stop simulator jobs
          before=$(counts)
          echo "$before"
          python3 deploy/tools/backup.py --out "$RUNNER_TEMP/backup/meridian.dump"

          $compose exec -T db sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          insert into invite_tokens (token_sha256, label) values (sha256('ci'), 'written-after-backup');
          SQL
          test "$(counts)" != "$before"

          python3 deploy/tools/restore.py "$RUNNER_TEMP/backup/meridian.dump" --yes
          after=$(counts)
          diff <(echo "$before") <(echo "$after")
          $compose exec -T api meridian db status

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml --profile metrics --profile sim \
            logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml --profile metrics --profile sim \
            down -v || true

  conventions:
    # GIT-WORKFLOW.md rules 3 and 7, automated. A rule enforced only by a human
    # is a rule that erodes.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit subjects are Conventional Commits with a known scope
        run: |
          set -euo pipefail
          # `store` was missing from this list. CLAUDE.md's architecture names
          # eight platform modules — orbit, prediction, scheduler, registry,
          # observations, reliability, store and api — and seven of them were
          # here. A scope list that omits a real module rejects correct commits,
          # which is how a convention check trains people to work around it.
          pattern='^(feat|fix|docs|test|refactor|perf|chore|ci|spec)\((orbit|prediction|scheduler|registry|observations|reliability|store|api|datasets|client|simulator|dashboard|site|firmware|ingest|deploy|docs|msp|repo)\): [a-z].{0,60}$'
          failed=0
          while read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::bad commit subject: $subject"
              failed=1
            fi
          # --no-merges is load-bearing. On a pull_request event
          # actions/checkout@v4 checks out refs/pull/N/merge, so HEAD is a
          # synthetic merge commit whose subject is "Merge <sha> into <sha>" —
          # which no Conventional Commits pattern matches, and which is not a
          # commit anybody wrote. Without this the check fails on every pull
          # request regardless of what its commits say.
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $failed

      - name: A Co-Authored-By line git cannot read is not a trailer
        # D-043 requires the trailer on AI-assisted commits and says nothing
        # about commits written without assistance — "the one that matters is
        # the commit that does *not* carry it". So presence is deliberately NOT
        # checked: demanding it everywhere would put the trailer on every commit
        # and destroy the signal the decision exists to preserve.
        #
        # What is checked is the failure that loses the record silently. A
        # `Co-Authored-By:` line separated from the trailer block by a blank
        # line, or trailing prose after it, is not parsed by git as a trailer —
        # `%(trailers:key=...)` returns nothing, `git log --author` cannot find
        # it, and the provenance is present to a human reader and absent to
        # every tool. That is worse than no trailer, because it looks done.
        #
        # Verified to fail, on a scratch repository, against a message with
        # prose after the trailer block — which is how we know it can.
        run: |
          set -euo pipefail
          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            written=$(git log -1 --format=%B "$sha" | grep -ci '^Co-Authored-By:' || true)
            parsed=$(git log -1 --format='%(trailers:key=Co-Authored-By,valueonly)' "$sha" \
              | grep -c . || true)
            if [ "$written" -gt 0 ] && [ "$parsed" -eq 0 ]; then
              echo "::error::$(git log -1 --format=%s "$sha")"
              echo "::error::  has a Co-Authored-By line that git does not parse as a trailer."
              echo "::error::  It must sit in the final paragraph, one trailer per line, nothing after it."
              failed=1
            fi
          done < <(git log --no-merges --format=%H "origin/${{ github.base_ref }}..HEAD")
          exit $failed

      - name: Warn when the diff exceeds 400 lines
        run: |
          set -euo pipefail
          changed=$(git diff --shortstat "origin/${{ github.base_ref }}...HEAD" \
            | grep -oE '[0-9]+ insertion|[0-9]+ deletion' | grep -oE '[0-9]+' \
            | paste -sd+ - | bc || echo 0)
          echo "diff size: ${changed} lines"
          if [ "${changed:-0}" -gt 400 ]; then
            echo "::warning::PR is ${changed} lines. Rule 7 asks for under 400 — consider splitting, usually interface first and implementation second."
          fi
