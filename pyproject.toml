[project]
name = "meridian-workspace"
version = "0.1.0"
description = "Workspace root. The distributions are platform/, client/ and simulator/."
requires-python = ">=3.11,<3.12"

[tool.uv.workspace]
members = ["platform", "client", "simulator"]

[tool.uv.sources]
meridian = { workspace = true }
meridian-client = { workspace = true }
meridian-sim = { workspace = true }

[dependency-groups]
dev = [
    # The three distributions, installed editable so tests import them without a
    # rebuild. They are listed here rather than as project dependencies because
    # the root is a workspace container and ships nothing itself.
    "meridian",
    "meridian-client",
    "meridian-sim",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

# Python is pinned to 3.11 deliberately. Raspberry Pi OS bookworm ships 3.11 and
# the platform runs on the Pi's NVMe. Developing on 3.12 and deploying on 3.11 is
# a week-15 surprise.

[tool.ruff]
# 88 and the rule selection below are CLAUDE.local.md section 9, verbatim. That
# section calls itself enforcement — "Aspirational standards decay. These are wired
# into CI" — and until D-044 it was not wired into anything. See D-044 for what was
# added, what was kept, and why each of the four deviations exists.
line-length = 88
target-version = "py311"
src = ["platform/src", "client/src", "simulator/src"]

[tool.ruff.lint]
select = [
    # CLAUDE.local.md section 9. Roughly: D and ANN make section 5's docstring and
    # units-on-every-argument rules checkable; C90 and PL make section 2's size
    # limits checkable; N, RET, ARG, TRY, PTH and ERA cover sections 3, 4 and 7.
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming conventions
    "D",        # docstrings — pydocstyle
    "ANN",      # type annotations required
    "C90",      # mccabe complexity
    "PL",       # pylint: too many args/branches/statements
    "SIM",      # simplification
    "RET",      # return statement hygiene
    "ARG",      # unused arguments
    "TRY",      # exception handling
    "PTH",      # pathlib over os.path
    "ERA",      # no commented-out code
    # Kept from the ruleset this replaced. Section 9 does not list these, and
    # dropping them to match it exactly would have un-enforced two *hard* project
    # rules — so the ruleset is the union rather than the substitution.
    "DTZ",      # bans naive datetime. CLAUDE.local.md section 6: "a naive
                # datetime anywhere is a bug", DATA-MODEL.md: "all timestamps
                # UTC, no exceptions".
    "TID",      # carries the banned-import rule below, which is the only
                # mechanical enforcement of ARCHITECTURE.md rule 2.
    "T20",      # bans stray print(), so CLI output is a deliberate exemption.
    "UP", "B", "RUF",
]

ignore = [
    # RUF001 and RUF002 flag σ, − and – as ambiguous unicode — the first in
    # string literals, the second in docstrings. Here they are correct domain
    # notation: "1σ" is how uncertainty is written throughout docs/ and the
    # report, and rewriting it as "1o" would be wrong. Both are needed because an
    # *attribute* docstring is a bare string expression rather than a docstring,
    # so it is RUF001 that fires on `ClockEstimate.uncertainty_s`. Neither rule
    # ever fires on code.
    "RUF001",
    "RUF002",
    # TRY003 bans long messages at the raise site, directing them into the
    # exception class instead. config.py's refusal reads "Refusing to start:
    # TOKEN_HASH_PEPPER still set to 'change-me' while the platform is publicly
    # reachable. Generate each with: openssl rand -hex 32" — the name of the
    # variable, the reason, and the command that fixes it. Moving that into a
    # class hierarchy would satisfy the rule and cost the operator the one thing
    # that makes the refusal actionable at 2 a.m. CLAUDE.local.md section 5 is
    # explicit that text which helps the reader beats structure that hides it.
    "TRY003",
]

[tool.ruff.format]
# Code blocks inside docs/ are illustrative, not compilable: elliptical protocol
# bodies, partial SQL, snippets showing one field of a message. Formatting them
# to the same rules as source produces churn that fights the author and makes a
# specification harder to read, so the formatter leaves prose alone. The linter
# still runs everywhere.
exclude = ["*.md"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags a function call as a default argument on the assumption it is a
# mutable-default mistake. FastAPI's dependency injection *is* this pattern —
# `Depends(get_connection)` must be evaluated at declaration time so FastAPI can
# see it and resolve it per request — and B008 already knows to exempt bare
# `Header(...)`/`Query(...)` with literal arguments, but not `Depends(some_func)`,
# whose argument is itself a call. Naming the dotted path here is what tells
# ruff this specific call is the idiom, not the mistake.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-statements = 30
max-returns = 4

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its docstring — `test_a_placeholder_password_inside_database_url_is_caught`
# says more than a summary line would, and D103 on every test function is exactly
# the noise CLAUDE.local.md section 5 warns trains readers to skip docstrings. The
# tests that need explaining have full docstrings anyway; the rule would only force
# them onto the ones that do not. ANN for the same reason on fixtures.
#
# PLR2004 goes too: `assert settings.heartbeat_interval_s == 30` is the assertion.
# Lifting 30 into a named constant would mean the test asserts the constant equals
# itself, which is the classic way a test stops testing anything.
#
# PLC0415 goes because several tests import *inside* the test body on purpose —
# tests/unit/test_layout.py imports `meridian` late to prove the src/ layout keeps
# `platform` off sys.path (D-012), and moving that import to the top would test the
# opposite of what it asserts.
"tests/**" = ["T20", "D", "ANN", "PLR2004", "PLC0415"]
# The site tools are operator-facing command line scripts, not library code:
# make-images.py reports the files it writes, stamp_assets.py reports what it
# restamped, and verify_site.py reports every invariant that failed. print is
# their output, which is the one place T201 is describing correct behaviour.
#
# D, ANN, PLR and C90 join it for the same reason. make-images.py is a drawing
# script built from small nested helpers (`project`, `screen`, `graticule`) whose
# meaning is local to the twenty lines around them, and whose "magic values" are
# the geometry itself; verify_site.py's complexity sits in one HTMLParser callback
# that the stdlib's interface shape dictates. These are stdlib-only build tools
# producing committed artefacts, not the code an outside contributor arrives to
# read — and CLAUDE.local.md section 9 scopes its own module-length check to
# `platform client simulator`, so the size and complexity families are scoped the
# same way here. E501 is deliberately *not* ignored: long lines are still fixed.
"site/tools/make-images.py" = ["T201", "D", "ANN", "PLR", "C90"]
"site/tools/stamp_assets.py" = ["T201", "D", "ANN", "PLR", "C90"]
"site/tools/verify_site.py" = ["T201", "D", "ANN", "PLR", "C90"]
# ARCHITECTURE.md rule 2: only platform/orbit imports propagation libraries.
# The ban below is global; this is the one module exempt from it, so the boundary
# is checked by CI rather than remembered by a reviewer.
"platform/src/meridian/orbit/**" = ["TID251"]
# Alembic fixes the shape of a revision file: module-level `revision`,
# `down_revision`, and an `upgrade`/`downgrade` pair it calls by name. The
# docstrings are present; D103 fires on the two functions in every one of the six
# files, where a summary line can only restate the file name it already carries.
"deploy/migrations/versions/*.py" = ["D103"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sgp4".msg = "Only meridian.orbit may import propagation libraries (ARCHITECTURE.md rule 2)."
"skyfield".msg = "Only meridian.orbit may import propagation libraries (ARCHITECTURE.md rule 2)."

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
# Both from CLAUDE.local.md section 9. disallow_any_explicit is the stricter of
# the two and the one with teeth: `strict` already bans *implicit* Any, but an
# explicit `dict[str, Any]` sails through it, and a response body typed that way
# is a body whose shape nothing checks. warn_unreachable catches the guard clause
# that can no longer fire after the condition above it changed.
disallow_any_explicit = true
warn_unreachable = true
mypy_path = ["platform/src", "client/src", "simulator/src"]

[[tool.mypy.overrides]]
module = ["sgp4.*", "skyfield.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[[tool.mypy.overrides]]
# A bare `class X(BaseModel):` fails disallow_any_explicit — BaseModel's own
# public surface (model_dump() -> dict[str, Any], the ConfigDict it accepts,
# the synthesized __init__ from Field() defaults) carries Any that a subclass
# cannot avoid, plugin or not. pydantic's own mypy plugin exists to resolve
# this properly, but its shipped pydantic 2.13.4 build crashes importing
# mypy.expandtype.ExpandTypeVisitor under mypy 2.3.0 (verified directly, not
# assumed) — adopt it once the two are compatible, not before. Scoped to
# api/models/ rather than global, so every other module keeps the check.
module = ["meridian.api.models.*"]
disallow_any_explicit = false

[tool.pytest.ini_options]
# --import-mode=importlib so two test files may share a basename across
# directories. Under the default "prepend" mode, tests/unit/test_store.py and
# tests/integration/test_store.py collide at collection with "import file
# mismatch" and the whole run is interrupted — and with four directories holding
# tests for the same modules, that collision is a matter of time. importlib also
# stops pytest mutating sys.path, which matters in a src/ layout where the
# installed distributions are what should be imported.
addopts = "-q --strict-markers --import-mode=importlib"
testpaths = ["tests"]
# One directory per marker, and each directory's conftest applies its own marker
# via `pytestmark` — so a new test file cannot forget to declare what it needs
# and leak a compose bring-up into the unit run.
#
#   uv run pytest -m "not integration and not e2e"   fast, no services
#   uv run pytest -m integration                     needs TimescaleDB
#   uv run pytest -m msp_conformance                 needs the API
#   uv run pytest -m e2e                             needs the compose stack
markers = [
    "integration: needs a running TimescaleDB",
    "msp_conformance: asserts exact MSP wire shapes against golden fixtures",
    "e2e: needs the full compose stack",
]

[tool.coverage.report]
# Report only. No threshold gate in Phase 1 — a coverage floor this early
# produces tests written for the floor.
show_missing = true
