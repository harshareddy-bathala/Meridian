global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules and their promtool tests: deploy/prometheus/rules/ and
# deploy/prometheus/tests/ (D-112). The tests live outside rules/ because every
# file matched here is loaded as rules.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: meridian
    metrics_path: /metrics
    # /metrics answers 404 without a bearer token (D-087), and that 404 is
    # byte-identical to the one an unrouted path returns — so a missing or
    # mismatched token here does not look like an authentication failure. It
    # looks like the endpoint is not there, and the target simply reads down.
    # If this job is down, check that metrics_token matches METRICS_TOKEN in
    # .env before looking anywhere else.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]

  # The jobs process: pass generation and scheduling (D-109, D-110). Its own
  # listener, reachable only inside the compose network, guarded by the same
  # token and answering the same 404 without it. The job name is what the
  # scheduling alerts match on; rename both together.
  - job_name: meridian-jobs
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["jobs:9464"]
