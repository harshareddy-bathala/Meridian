# Keep the last good copy, serve it only when the api does not answer (D-282).
# Included by every location of nginx.conf that holds a public view, and by
# nothing else.

proxy_cache front;
proxy_cache_key $request_uri;
proxy_cache_methods GET HEAD;

# Every 200 is stale one second after it was stored, so the next request goes
# to the api, and a copy is served instead only when the api does not answer.
# Without this, a copy would be served as current, which §12.2 names as the
# serious failure.
proxy_cache_valid 200 1s;
proxy_ignore_headers Cache-Control Expires;
proxy_cache_use_stale error timeout http_502 http_503 http_504;

# The api's Date, not this process's, so a stale copy says when it was made.
proxy_pass_header Date;

# HIT, MISS, EXPIRED or STALE. The dashboard reads STALE as "a snapshot".
add_header Meridian-Cache $upstream_cache_status always;

proxy_pass http://platform;
