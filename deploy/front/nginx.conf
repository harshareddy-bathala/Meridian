# The front: what a visitor, a station and the tunnel reach first (D-282).
#
# It forwards every request to the api unchanged, and keeps the last good copy
# of the public pages and the public read API. When the api answers, a visitor
# gets the api's answer. When it does not, a visitor gets the last copy, marked
# `Meridian-Cache: STALE`, with the `Date` the api gave it, so the dashboard can
# say how old it is (EVALUATION.md §12.2). Nothing else is ever kept: MSP,
# /metrics and /healthz are forwarded and forgotten.
#
# Written for nginxinc/nginx-unprivileged: no root, port 8080, scratch in /tmp,
# the cache in the image's own /var/cache/nginx, which the front-cache volume
# copies the ownership of. The root filesystem is read-only (D-206).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    # Who asked for what is the api's to log, once. A second log here would
    # hold every visitor's address again, with nothing gained.
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's own resolver, asked again every ten seconds, so a restarted api
    # with a new address is found, and a stopped one is a failure to connect
    # rather than a name nginx refused to start without.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream platform {
        zone platform 64k;
        server api:8000 resolve;
        keepalive 8;
    }

    # The last good copies. Thirty days unread before one is dropped: the
    # length of the longest outage a station's own reports survive (D-281).
    proxy_cache_path /var/cache/nginx/front levels=1:2 keys_zone=front:10m
                     max_size=256m inactive=30d use_temp_path=off;

    server {
        listen 8080;

        # Above the api's largest limit, an observation at 256 KiB, so the api's
        # own MSP error is what a station sees for any body it refuses.
        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Every request header is forwarded as sent, CF-Connecting-IP among
        # them, which the api trusts only in the public file, where nothing but
        # the tunnel can reach this port (D-206).

        # A dead api is a failure in two seconds, never a hang (§12.2: "fails
        # if the page hangs waiting on an upstream").
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # Everything else: forwarded, never kept.
        location / {
            proxy_pass http://platform;
        }

        # The dashboard, and the public read API it draws from.
        location = / {
            include /etc/nginx/meridian/snapshot.conf;
        }
        location /assets/ {
            include /etc/nginx/meridian/snapshot.conf;
        }
        location /api/v1/ {
            include /etc/nginx/meridian/snapshot.conf;
        }

        # The healthcheck's, from inside the container only. It says nginx is
        # serving, not that the api is: a front that is up while the api is
        # down is exactly the case it exists for.
        location = /front-ready {
            allow 127.0.0.1;
            deny all;
            access_log off;
            return 204;
        }
    }
}
