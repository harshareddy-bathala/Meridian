# The ingest service: `meridian-ingest follow`, in an image of its own (D-352).
#
# Not a profile of the main file, because the platform must be complete without
# it (D-138): a deployment that never names this file never builds, pulls or runs
# anything that talks to an external source. Add it to every command on the host
# that runs ingest:
#
#   docker compose -f deploy/docker-compose.yml ... -f deploy/docker-compose.ingest.yml up -d
#
# It needs two things on the host first:
#   - deploy/ingest.toml, from deploy/ingest.live.toml.example, with
#     raw_root = "/var/lib/meridian-ingest/raw";
#   - deploy/secrets/ingest/, a directory (mode 0700) holding firms_map_key and
#     earthdata_token once those sources are enabled. It may be empty: a key is
#     read only by the source that needs it.
#
# It writes to the platform's database as meridian_api, which may change rows
# and nothing else (D-207), and is never on the scheduling path: a source that
# hangs delays its own round and no one else's (D-225).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-read-only: &read-only
  type: bind
  read_only: true
  bind:
    create_host_path: false

services:
  ingest:
    image: ${MERIDIAN_INGEST_IMAGE:-meridian-ingest:local}
    build:
      context: ..
      dockerfile: deploy/ingest/Dockerfile
    # Built on the host that runs it, never pulled: no registry publishes it.
    # `compose pull` skips it, and `up` builds it when it is missing.
    pull_policy: build
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    logging: *logging
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://meridian_api:${API_DATABASE_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-meridian}
      MERIDIAN_INGEST_CONFIG: /run/config/ingest.toml
      FIRMS_MAP_KEY_FILE: /run/secrets/meridian-ingest/firms_map_key
      EARTHDATA_TOKEN_FILE: /run/secrets/meridian-ingest/earthdata_token
    volumes:
      - ingest-raw:/var/lib/meridian-ingest
      - <<: *read-only
        source: ./ingest.toml
        target: /run/config/ingest.toml
      - <<: *read-only
        source: ./secrets/ingest
        target: /run/secrets/meridian-ingest

  # Open imagery of the published areas, once a day (D-375): search each area's
  # clearest scene, render it from the raw store, publish it under
  # ${PUBLISHED_DIR}/imagery for the API. The same image as `ingest`, but no
  # database: a scene is a manifest and files, never a row (D-229).
  #
  # It needs, on the host, [imagery] in deploy/ingest.toml (see
  # deploy/ingest.live.toml.example) and ${PUBLISHED_DIR}/imagery created, owned
  # by uid 10001. The rest of PUBLISHED_DIR is read-only here: it reads the areas
  # summary and writes nothing else the API serves.
  ingest-imagery:
    image: ${MERIDIAN_INGEST_IMAGE:-meridian-ingest:local}
    build:
      context: ..
      dockerfile: deploy/ingest/Dockerfile
    pull_policy: build
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    logging: *logging
    # A 4096 px window of three bands, warped and tiled, fits well inside this;
    # the cloud host has 2 GB for everything (D-372).
    mem_limit: 1g
    tmpfs:
      - /tmp
    command: ["meridian-ingest", "imagery", "refresh", "--interval", "86400", "--alive", "/tmp/imagery-alive"]
    environment:
      MERIDIAN_INGEST_CONFIG: /run/config/ingest.toml
    # Alive, not successful: the file is touched every minute while it waits
    # and between areas while it works. Whether a source answered is in the
    # log, and a restart would not make one answer.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/imagery-alive') < 1800 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ingest-raw:/var/lib/meridian-ingest
      - <<: *read-only
        source: ./ingest.toml
        target: /run/config/ingest.toml
      - <<: *read-only
        source: ${PUBLISHED_DIR:-../data/published}
        target: /published
      - type: bind
        source: ${PUBLISHED_DIR:-../data/published}/imagery
        target: /published/imagery
        bind:
          create_host_path: false

volumes:
  # The raw store cannot be recreated without going back to every source, and is
  # not in the database dump (OPERATIONS.md § The raw store is not in the
  # database backup).
  ingest-raw:
