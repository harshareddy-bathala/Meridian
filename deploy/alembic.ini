# Alembic supplies revision ordering and the applied-revision table. The schema
# itself lives in deploy/migrations/sql/ as hand-written SQL — see D-019.
#
#   uv run alembic -c deploy/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations

# migrations/ is on the path so revision scripts can import the shared SQL loader
# from _sql.py. This must be here rather than in env.py: read-only commands like
# `alembic history` load the revision scripts without ever running env.py.
prepend_sys_path = . %(here)s/migrations
path_separator = space

# sqlalchemy.url is set from DATABASE_URL in migrations/env.py. It is deliberately
# absent here so a database URL is never committed to a public repository.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
