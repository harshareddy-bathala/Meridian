# Platform secrets from files rather than variables (D-114, D-201).
#
#   python deploy/tools/rotate_secret.py init
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.secrets.yml up -d
#
# Every file lives in deploy/secrets/, which is gitignored and which the tool
# creates 0700, with each file 0444 inside it. The directory keeps other users on
# the host out; the file has to be world-readable because it is bind-mounted into
# a container whose process is not the operator's uid.
#
# One file per secret, mounted one at a time with create_host_path off, so a
# missing file stops `up` with its path instead of mounting an empty directory
# where the secret should be. A secret read from a file wins over the same
# variable left in deploy/.env.
#
# Prometheus reads metrics_token from the same file as the API and the jobs
# process, so the scrape and the endpoint cannot disagree the way two copies can
# (D-087). docs/OPERATIONS.md § Rotating secrets is the runbook.

x-secret: &secret
  type: bind
  read_only: true
  bind:
    create_host_path: false

services:
  api:
    environment:
      TOKEN_HASH_PEPPER_FILE: /run/secrets/meridian/token_hash_pepper
      # Empty outside a rotation, which means no previous pepper (D-201).
      TOKEN_HASH_PEPPER_PREVIOUS_FILE: /run/secrets/meridian/token_hash_pepper_previous
      REGISTRATION_INVITE_TOKEN_FILE: /run/secrets/meridian/registration_invite_token
      METRICS_TOKEN_FILE: /run/secrets/meridian/metrics_token
    volumes:
      - <<: *secret
        source: ./secrets/token_hash_pepper
        target: /run/secrets/meridian/token_hash_pepper
      - <<: *secret
        source: ./secrets/token_hash_pepper_previous
        target: /run/secrets/meridian/token_hash_pepper_previous
      - <<: *secret
        source: ./secrets/registration_invite_token
        target: /run/secrets/meridian/registration_invite_token
      - <<: *secret
        source: ./secrets/metrics_token
        target: /run/secrets/meridian/metrics_token

  jobs:
    environment:
      METRICS_TOKEN_FILE: /run/secrets/meridian/metrics_token
    volumes:
      - <<: *secret
        source: ./secrets/metrics_token
        target: /run/secrets/meridian/metrics_token

  prometheus:
    volumes:
      # The same target as the base file's mount, so this replaces it.
      - <<: *secret
        source: ./secrets/metrics_token
        target: /etc/prometheus/metrics_token
