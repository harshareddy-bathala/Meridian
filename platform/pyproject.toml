[project]
name = "meridian"
version = "0.1.0"
description = "Meridian platform — orbit, registry, observations, scheduling and the public API."
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "psycopg[binary,pool]>=3.2",
    "sgp4>=2.23",
    "skyfield>=1.49",
    "prometheus-client>=0.21",
]

[project.scripts]
meridian = "meridian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]
